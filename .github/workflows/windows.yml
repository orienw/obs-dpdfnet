name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Download OBS runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/dependency-versions.ps1
          $version = $DpdfnetDefaultObsVersion
          $expected = $DpdfnetKnownObsRuntimeHashes[$version]
          if (!$expected) { throw "No pinned hash for the OBS $version runtime" }
          $zip = "build/obs-runtime/OBS-Studio-$version-Windows-x64.zip"
          New-Item -ItemType Directory -Force build/obs-runtime | Out-Null
          gh release download $version `
            --repo obsproject/obs-studio `
            --pattern "OBS-Studio-$version-Windows-x64.zip" `
            --dir build/obs-runtime
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "OBS runtime hash mismatch: expected $expected, got $actual"
          }
          Expand-Archive $zip build/obs-runtime/extracted
          $obsDll = Get-ChildItem build/obs-runtime/extracted -Recurse `
            -Filter obs.dll | Where-Object { $_.FullName -match 'bin\\64bit\\obs\.dll$' } |
            Select-Object -First 1
          if (!$obsDll) { throw "Downloaded OBS archive contains no x64 obs.dll" }
          $obsRoot = Split-Path (Split-Path (Split-Path $obsDll.FullName))
          "OBS_INSTALL_DIR=$obsRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Verify generated model fixtures
        shell: pwsh
        run: |
          python -m pip install onnx==1.21.0
          python tests/generate_model_contract_fixtures.py build/generated-fixtures
          $expected = Get-ChildItem tests/fixtures/model-contract -Filter *.onnx
          $generatedFiles = Get-ChildItem build/generated-fixtures -Filter *.onnx
          $nameDrift = Compare-Object `
            ($expected.Name | Sort-Object) `
            ($generatedFiles.Name | Sort-Object)
          if ($nameDrift) { throw "Tracked and generated fixture sets differ" }
          foreach ($file in $expected) {
            $generated = Join-Path build/generated-fixtures $file.Name
            if (!(Test-Path $generated)) { throw "Missing generated fixture $($file.Name)" }
            $left = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $right = (Get-FileHash $generated -Algorithm SHA256).Hash
            if ($left -ne $right) { throw "Fixture drift: $($file.Name)" }
          }

      - name: Build
        shell: pwsh
        run: |
          ./scripts/build-windows-msvc.ps1 -ObsInstallDir $env:OBS_INSTALL_DIR

      - name: Test
        shell: pwsh
        run: |
          ./scripts/test-windows.ps1 `
            -ObsInstallDir $env:OBS_INSTALL_DIR `
            -RequireCleanProvenance

      - name: Benchmark
        shell: pwsh
        run: |
          ./scripts/benchmark-windows.ps1 -ObsInstallDir $env:OBS_INSTALL_DIR

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: processor-benchmark
          path: build/processor-benchmark.txt

      - name: Package release candidate
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          . ./scripts/dependency-versions.ps1
          ./scripts/release-windows.ps1 `
            -Version $DpdfnetDefaultPluginVersion `
            -ObsInstallDir $env:OBS_INSTALL_DIR `
            -SkipBuild

      - name: Upload release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            build/obs-dpdfnet-*-windows-x64.zip
            build/obs-dpdfnet-*-windows-x64.zip.sha256
            build/release-notes-v*.md
            build/release-commit-v*.txt
            build/msvc/Release/tests-passed.txt

  # Releasing: set the version in VERSION, push that commit to main, then
  #   git tag -a v<version> -m "obs-dpdfnet <version>" && git push origin v<version>
  # build-and-test builds and tests the tag, and this job turns its zip into a
  # draft release. Write the "What's Changed" section in the draft and publish
  # it. If this job refuses the tag, delete the tag locally and on GitHub, fix
  # the problem, and tag again.
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="build/obs-dpdfnet-$version-windows-x64.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the version in VERSION"
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < "build/release-commit-v$version.txt")" != "$GITHUB_SHA" ]; then
            echo "::error::The zip was not built from $GITHUB_SHA"
            exit 1
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          prerelease=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --draft "${prerelease[@]}" \
            --title "$version" \
            --notes-file "build/release-notes-v$version.md" \
            "$zip" "$zip.sha256"
