DPDFNet.ModelSelection="Model"
DPDFNet.ModelSelection.Tooltip="DPDFNet8 sounds best but needs more CPU. DPDFNet2 is lighter. The bundled models run on the CPU at 48 kHz; other OBS sample rates are resampled. If the CPU cannot keep up, noise suppression pauses, audio keeps passing through without it, and processing retries automatically."
DPDFNet.Model.Quality="DPDFNet8 (best quality, more CPU)"
DPDFNet.Model.LowCpu="DPDFNet2 (lower CPU)"
DPDFNet.Model.Custom="Custom ONNX model"
DPDFNet.ModelPath="Model file"
DPDFNet.ModelPath.Tooltip="A DPDFNet-compatible ONNX model. Incompatible files are rejected and the active model stays loaded."
DPDFNet.ShowDetails="Show details"
DPDFNet.ShowDetails.Tooltip="Show processing measurements for the current run. Timing restarts on model, format, and reset changes."
DPDFNet.RefreshStatus="Refresh"
DPDFNet.RefreshStatus.Tooltip="Update the status and diagnostics."
DPDFNet.InputChannel="Input channel"
DPDFNet.InputChannel.Input1="Input 1 / left"
DPDFNet.InputChannel.Input2="Input 2 / right"
DPDFNet.InputChannel.Mix="Mix all channels"
DPDFNet.InputChannel.Tooltip="The channel to enhance. Mix all channels averages every input channel."
DPDFNet.AttenuationLimit="Suppression limit"
DPDFNet.AttenuationLimit.Tooltip="Maximum noise reduction. Start at 24 to 30 dB. Higher values remove more noise but can add speech artifacts."
DPDFNet.WetMix="Mix"
DPDFNet.WetMix.Tooltip="Blend of enhanced and original audio. 100% is enhanced only."
DPDFNet.OutputGain="Output gain"
DPDFNet.OutputGain.Tooltip="Gain applied after the blend. Positive values can clip."
DPDFNet.Bypass="Bypass"
DPDFNet.Bypass.Tooltip="Passes the original audio, delay-matched to the processed path, and keeps the model warm. Disable the filter in OBS to stop its CPU use."
DPDFNet.ResetState="Reset processing"
DPDFNet.ResetState.Tooltip="Restarts processing if it was paused or disabled and clears the model state, fault counters, and timing."
